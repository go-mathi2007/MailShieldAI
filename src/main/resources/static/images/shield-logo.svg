<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="50%" stop-color="#6C4CF1"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="mailGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EDE9FE"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#6C4CF1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#6C4CF1" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Outer Shield -->
  <path d="M50 5 L88 20 C88 56 68 83 50 95 C32 83 12 56 12 20 Z" 
        fill="url(#shieldGrad)" 
        filter="url(#glow)"/>

  <!-- Inner Shield Border -->
  <path d="M50 11 L82 24 C82 54 64 78 50 88 C36 78 18 54 18 24 Z" 
        fill="none" 
        stroke="rgba(255,255,255,0.3)" 
        stroke-width="2"/>

  <!-- Envelope Body -->
  <rect x="30" y="38" width="40" height="28" rx="4" fill="url(#mailGrad)" filter="url(#glow)"/>

  <!-- Envelope Flap (open/creased) -->
  <path d="M30 40 L50 54 L70 40" fill="none" stroke="#6C4CF1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Shield Core Sparkle / Check -->
  <circle cx="50" cy="52" r="5" fill="#6C4CF1"/>
  <path d="M48 52 L50 54 L53 50" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
