# MailShield AI - Configuration
server.port=8080

# Spring Application Name
spring.application.name=MailShieldAI

# H2 In-Memory Database Configuration
spring.datasource.url=jdbc:h2:mem:mailshielddb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# H2 Console (Accessible at /h2-console for diagnostics)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# Servlet Multipart Upload Limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.enabled=true

# Naive Bayes Classifier & Dataset Configuration
mailshield.dataset.path=classpath:dataset/emails.csv
mailshield.classifier.alpha=1.0
mailshield.evaluation.test-ratio=0.20
mailshield.evaluation.random-seed=42

# Logging
logging.level.com.mailshield=INFO
logging.level.org.springframework=WARN
